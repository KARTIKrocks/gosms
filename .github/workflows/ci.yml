name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
        module: [".", "./twilio", "./sns", "./vonage", "./msg91"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage-core.out -covermode=atomic ./...
          cd twilio && go test -race -coverprofile=../coverage-twilio.out -covermode=atomic ./... && cd ..
          cd sns && go test -race -coverprofile=../coverage-sns.out -covermode=atomic ./... && cd ..
          cd vonage && go test -race -coverprofile=../coverage-vonage.out -covermode=atomic ./... && cd ..
          cd msg91 && go test -race -coverprofile=../coverage-msg91.out -covermode=atomic ./... && cd ..
          cat coverage-core.out > coverage.out
          tail -n +2 coverage-twilio.out >> coverage.out
          tail -n +2 coverage-sns.out >> coverage.out
          tail -n +2 coverage-vonage.out >> coverage.out
          tail -n +2 coverage-msg91.out >> coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "./twilio", "./sns", "./vonage", "./msg91"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  # Structural linting for every Markdown file in the repo. This lives here
  # rather than in the Docs workflow because that one is path-filtered to
  # website/**, so a change to the root README, CONTRIBUTING.md, or
  # SECURITY.md would never trigger it. Config and rule rationale:
  # .markdownlint-cli2.jsonc. Uses the website's markdownlint-cli2
  # devDependency rather than a separate install.
  docs-lint:
    name: lint (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      # Run from the repository root, not website/. The config globs every
      # .md in the repo and globs resolve against the working directory, so
      # running this from website/ would silently check only the site's own
      # pages.
      - name: Lint Markdown
        run: make lint-docs

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem ./...
          cd twilio && go test -bench=. -benchmem ./... && cd ..
          cd sns && go test -bench=. -benchmem ./... && cd ..
          cd vonage && go test -bench=. -benchmem ./... && cd ..
          cd msg91 && go test -bench=. -benchmem ./... && cd ..
